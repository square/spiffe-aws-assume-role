name: CI
on: [push]
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2 https://github.com/actions/checkout/releases/tag/v2

      - name: Install Go
        uses: actions/setup-go@19bb51245e9c80abacb2e91cc42b33fa478b8639  # https://github.com/actions/setup-go/releases/tag/v4
        with:
          go-version-file: go.mod

      - name: Lint code
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0 https://github.com/golangci/golangci-lint-action/releases/tag/v8.0.0
        with:
          version: v2.4.0

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: go build ./...
